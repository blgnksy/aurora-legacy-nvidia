name: Build Aurora DX Custom NVIDIA Open

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      upstream_digest: ${{ steps.upstream.outputs.digest }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get upstream image digest
        id: upstream
        run: |
          DIGEST=$(skopeo inspect docker://ghcr.io/ublue-os/aurora-dx-nvidia-open:stable | jq -r '.Digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Get our image's recorded base digest
        id: ours
        run: |
          DIGEST=""
          if skopeo inspect docker://ghcr.io/${{ github.repository_owner }}/aurora-dx-custom-nvidia-open:latest > /tmp/inspect.json 2>/dev/null; then
            DIGEST=$(jq -r '.Labels["org.opencontainers.image.base.digest"] // ""' /tmp/inspect.json)
          fi
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Compare digests
        id: compare
        run: |
          UPSTREAM="${{ steps.upstream.outputs.digest }}"
          OURS="${{ steps.ours.outputs.digest }}"
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" != "schedule" ] || [ "$UPSTREAM" != "$OURS" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Building: event=$EVENT upstream=$UPSTREAM ours=$OURS"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Upstream digest unchanged, skipping build."
          fi

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          context: .
          containerfiles: |
            Containerfile.nvidia-open
          image: aurora-dx-custom-nvidia-open
          tags: latest
          oci: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Aurora DX with NVIDIA open drivers for RTX/Turing+ GPUs
            org.opencontainers.image.base.name=ghcr.io/ublue-os/aurora-dx-nvidia-open:stable
            org.opencontainers.image.base.digest=${{ needs.check-upstream.outputs.upstream_digest }}

      - name: Push image
        id: push
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}

      - name: Sign image
        run: |
          cosign sign --yes \
            --key env://COSIGN_PRIVATE_KEY \
            ghcr.io/${{ github.repository_owner }}/aurora-dx-custom-nvidia-open@${{ steps.push.outputs.digest }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ""
